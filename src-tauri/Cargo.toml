[package]
name = "cbreader"
version = "1.2.2"
description = "Lecteur de bandes dessinées CBZ/CBR"
authors = []
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"

# Desktop-only: none of these three have a mobile implementation (confirmed
# against each plugin's own platform gating), and the self-updating flow they
# support doesn't map onto how Android/iOS apps get updated anyway. Kept out
# of the mobile dependency graph entirely via the target filter, rather than
# just skipping their registration in lib.rs, so `cargo`/`tauri android`
# never has to build them (or their platform-specific transitive deps) at all.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
